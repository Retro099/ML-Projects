version: '3.8'

services:
  fraud-web:          # ← Streamlit demo (new)
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

  fraud-api:          # ← old CLI predict.py (still works!)
    build: .
    volumes:
      - ./artifacts:/app/artifacts
    command: python predict.py